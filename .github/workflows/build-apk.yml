name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests and static checks
        run: |
          python -m unittest -v test_core test_sync
          python check_py311.py
          python check_android_static.py
          python check_apk_files.py

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 首次构建要下载 Android SDK/NDK（约 2GB），缓存后重跑只要几分钟
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 用 Kivy 官方 buildozer 镜像。之前用 ArtemSBulgakov/buildozer-action@v1
      # 失败，原因是它内部自己构建 Docker 镜像时基于 ubuntu:latest（新版本），
      # openjdk-r PPA 在新 Ubuntu 上已没有 Release 文件，apt update 直接失败。
      - name: Build APK with Buildozer
        run: |
          mkdir -p "$HOME/.buildozer"
          chmod -R 777 "$HOME/.buildozer"
          docker run --rm -u 0:0 \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -e HOME=/home/user \
            kivy/buildozer -v android debug

      - name: Show APK files
        run: ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beidanci-apk
          path: bin/*.apk
          if-no-files-found: error
