name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests and static checks
        run: |
          python -m unittest -v test_core test_sync
          python check_py311.py
          python check_android_static.py
          python check_apk_files.py

  build:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Cache buildozer / pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Gradle 8 / AGP 8 需要 Java 17；runner 默认 JAVA_HOME 是 Java 11
          export JAVA_HOME="$JAVA_HOME_17_X64"
          java -version
          buildozer -v android debug

      - name: Show APK files
        run: ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beidanci-apk
          path: bin/*.apk
          if-no-files-found: error
