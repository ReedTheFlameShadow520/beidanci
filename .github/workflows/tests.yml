name: tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 纯逻辑测试，不需要 Kivy / Android 环境，几秒就能跑完
      - name: Run unit tests
        run: python -m unittest -v test_core test_sync
