name: tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pure logic tests + static checks; no Kivy/Android environment needed (about 15s).
      - name: Run unit tests
        run: python -m unittest -v test_core test_sync

      - name: Static checks
        run: |
          python check_py311.py
          python check_android_static.py
          python check_apk_files.py
